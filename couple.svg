<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
<defs>
  <linearGradient id="sareeGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#C9622F"/>
    <stop offset="100%" stop-color="#9E1B32"/>
  </linearGradient>
  <linearGradient id="shirtGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFBEE"/>
    <stop offset="100%" stop-color="#F1CD6B"/>
  </linearGradient>
  <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#2B1712" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#2B1712" stop-opacity="0"/>
  </radialGradient>
</defs>

<ellipse cx="150" cy="404" rx="98" ry="12" fill="url(#groundShadow)"/>

<!-- ================= BRIDE ================= -->
<g id="bride">
  <!-- saree drape / body -->
  <path d="M108 168
           C90 190 78 230 76 270
           C74 310 78 350 86 392
           L150 392
           L150 200
           C150 182 132 168 108 168 Z" fill="url(#sareeGrad)"/>
  <!-- pallu diagonal drape -->
  <path d="M112 170 L150 200 L150 260 L96 200 Z" fill="#D4A017" opacity="0.9"/>
  <!-- hem border -->
  <path d="M80 372 L150 372 L150 392 L86 392 Z" fill="#D4A017"/>
  <!-- pleats hint -->
  <path d="M118 220 L112 388 M132 210 L128 388 M144 202 L142 388" stroke="#7a1526" stroke-width="2" opacity="0.5" fill="none"/>

  <!-- near arm reaching to groom -->
  <path d="M144 220 C158 232 166 244 168 256" stroke="#C9622F" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="169" cy="259" r="8" fill="#E8AD7D"/>

  <!-- neck + head -->
  <rect x="122" y="130" width="16" height="20" rx="6" fill="#E8AD7D"/>
  <circle cx="130" cy="112" r="24" fill="#E8AD7D"/>
  <!-- hair -->
  <path d="M106 108 C104 84 116 68 130 68 C146 68 158 84 156 108
           C156 96 148 86 130 86 C114 86 106 96 106 108 Z" fill="#2B1712"/>
  <path d="M108 108 C106 122 110 134 118 140 L112 140 C104 130 102 116 106 106 Z" fill="#2B1712"/>
  <!-- bun, worn low at the back of the head -->
  <circle cx="108" cy="122" r="10" fill="#2B1712"/>
  <!-- jasmine string wrapped around the bun -->
  <circle cx="98" cy="116" r="3" fill="#FFFDF6"/>
  <circle cx="95" cy="123" r="3" fill="#FFFDF6"/>
  <circle cx="97" cy="130" r="3" fill="#FFFDF6"/>
  <circle cx="102" cy="135" r="3" fill="#FFFDF6"/>
  <!-- face -->
  <circle cx="124" cy="108" r="2.2" fill="#2B1712"/>
  <path d="M129 106 Q132 108 130 111" stroke="#2B1712" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M117 121 Q124 127 131 121" stroke="#7a3a20" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- bindi -->
  <circle cx="124" cy="99" r="2.6" fill="#9E1B32"/>

  <!-- jewellery: layered necklace -->
  <path d="M118 148 Q130 158 142 148" stroke="#D4A017" stroke-width="3" fill="none"/>
  <path d="M116 152 Q130 165 144 152" stroke="#D4A017" stroke-width="3" fill="none"/>
  <path d="M114 157 Q130 173 146 157" stroke="#F1CD6B" stroke-width="3" fill="none"/>
  <!-- bangles -->
  <circle cx="169" cy="248" r="4" fill="none" stroke="#D4A017" stroke-width="2.5"/>
  <circle cx="169" cy="255" r="4" fill="none" stroke="#D4A017" stroke-width="2.5"/>
</g>

<!-- ================= GROOM ================= -->
<g id="groom">
  <!-- veshti / dhoti -->
  <path d="M172 220 C168 260 166 320 168 392 L232 392
           C234 320 232 260 226 220 Z" fill="url(#shirtGrad)"/>
  <!-- front pleat drape -->
  <path d="M196 224 C192 280 190 340 196 392 L204 392
           C202 340 202 280 204 224 Z" fill="#e9d18f"/>
  <!-- dhoti hem border -->
  <path d="M168 384 L232 384 L232 392 L168 392 Z" fill="#D4A017"/>

  <!-- shirt -->
  <path d="M176 168 C168 172 164 184 164 196 L164 232 L234 232 L234 196
           C234 184 230 172 222 168
           C216 178 184 178 176 168 Z" fill="url(#shirtGrad)"/>
  <!-- sleeves -->
  <path d="M164 196 C154 202 146 212 142 224 L152 232 C158 220 164 210 170 202 Z" fill="#F1CD6B"/>
  <path d="M234 196 C244 200 250 208 252 216 L244 224 C240 214 236 206 230 200 Z" fill="#F1CD6B"/>
  <!-- buttons -->
  <circle cx="199" cy="182" r="1.6" fill="#9E1B32"/>
  <circle cx="199" cy="192" r="1.6" fill="#9E1B32"/>
  <circle cx="199" cy="202" r="1.6" fill="#9E1B32"/>
  <circle cx="199" cy="212" r="1.6" fill="#9E1B32"/>

  <!-- near arm reaching to bride -->
  <path d="M172 206 C160 216 152 228 148 240" stroke="#F1CD6B" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="147" cy="243" r="8" fill="#E8AD7D"/>
  <!-- watch -->
  <circle cx="252" cy="218" r="4" fill="#2B1712"/>

  <!-- neck + head -->
  <rect x="188" y="128" width="16" height="20" rx="6" fill="#E8AD7D"/>
  <circle cx="196" cy="108" r="23" fill="#E8AD7D"/>
  <!-- hair -->
  <path d="M175 104 C174 84 184 68 196 68 C210 68 220 84 218 104
           C214 92 206 84 196 84 C186 84 178 92 175 104 Z" fill="#2B1712"/>
  <!-- beard -->
  <path d="M178 108 C178 122 186 134 196 136 C206 134 214 122 214 108
           C214 118 206 126 196 126 C186 126 178 118 178 108 Z" fill="#2B1712" opacity="0.92"/>
  <!-- face -->
  <circle cx="188" cy="104" r="2.4" fill="#2B1712"/>
  <circle cx="204" cy="104" r="2.4" fill="#2B1712"/>
  <path d="M188 116 Q196 121 204 116" stroke="#7a3a20" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- tilak -->
  <rect x="194.5" y="88" width="3" height="10" rx="1.5" fill="#9E1B32"/>

  <!-- sandals -->
  <ellipse cx="180" cy="393" rx="12" ry="4" fill="#5a3a20"/>
  <ellipse cx="222" cy="393" rx="12" ry="4" fill="#5a3a20"/>
</g>
</svg>
